# Kahanio voice Worker. Deploy (owner only): see worker/README.md.
name = "kahanio-voice"
main = "index.ts"
compatibility_date = "2026-11-01"

# Our own domain (clientorahq.com is in the same Cloudflare account). Ad and privacy blockers often block
# *.workers.dev, which made the page say "could not reach". workers.dev keeps working as a fallback.
# Keep the workers.dev address on as well (a site still pointing at it must not break; it is the fallback).
workers_dev = true
preview_urls = false
routes = [
  { pattern = "kahanio-api.clientorahq.com", custom_domain = true }
]

[vars]
ALLOWED_ORIGINS = "https://kahanio.clientorahq.com,https://kahanio.vercel.app,http://localhost:4830,http://localhost:4832"

# Per-IP limit: 20 requests a minute (period must be 10 or 60 seconds). Needs Wrangler 4.36+.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Required feedback storage. Run `npx.cmd wrangler d1 create kahanio-feedback`, put its database_id here,
# then remove the # from the four lines below and deploy (see README).
# [[d1_databases]]
# binding = "DB"
# database_name = "kahanio-feedback"
# database_id = "PASTE-ID-HERE"
