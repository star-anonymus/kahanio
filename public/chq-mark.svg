<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="400" height="400"><defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9f8ff"/><stop offset=".5" stop-color="#7df3ff"/><stop offset="1" stop-color="#29e6ff"/></linearGradient>
    <radialGradient id="core" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#0c2a40"/><stop offset="1" stop-color="#03101b"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g id="mark">
      <!-- outer glowing ring -->
      <circle cx="200" cy="200" r="178" fill="none" stroke="#29e6ff" stroke-width="22" opacity=".95" filter="url(#glow)"/>
      <!-- dashed tick ring -->
      <circle cx="200" cy="200" r="178" fill="none" stroke="#02060c" stroke-width="24" stroke-dasharray="7 21.9" opacity=".85"/>
      <!-- core -->
      <circle cx="200" cy="200" r="158" fill="url(#core)"/>
      <circle cx="200" cy="200" r="132" fill="none" stroke="#0fb8d8" stroke-width="5" opacity=".9"/>
      <!-- the C -->
      <path d="M 262 152 A 78 78 0 1 0 262 248" fill="none" stroke="url(#cg)" stroke-width="44" stroke-linecap="round" filter="url(#soft)"/>
    </g>
  </defs><use href="#mark" xlink:href="#mark"/></svg>
